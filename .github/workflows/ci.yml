name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        run: npm ci --prefix tests --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check documentation
        run: npm run check:docs

      - name: Check generated provider registry
        run: npm run check:structure

      - name: Run AIMix unit tests
        run: npm run test:aimix

      - name: Lint AIMix core
        run: npx eslint src/aimix src/app/api/aimix scripts sdk

      - name: Check committed whitespace
        run: git diff-tree --check --no-commit-id --root -r HEAD
