name: Bug report
description: Report a reproducible AIMix defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, tokens, cookies, private prompts, or exploit details.
  - type: input
    id: version
    attributes:
      label: AIMix version or commit
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options: [Source, Docker, CLI package, Other]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, client, provider, and sanitized model route.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing report.
          required: true
        - label: I removed all credentials and private data.
          required: true
        - label: This is not a confidential security report.
          required: true
